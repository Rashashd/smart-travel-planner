name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-fake-key-for-ci
          JWT_SECRET: ci-secret
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/travel
          CLASSIFIER_PATH: ml/classifier.joblib
          SLACK_WEBHOOK_URL: https://hooks.slack.com/services/fake/fake/fake
        run: uv run pytest tests/ -v
